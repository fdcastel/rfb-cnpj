rfb_cnpj:
  target: prod
  outputs:
    prod:
      type: duckdb
      threads: 6

      path: "{{ env_var('RFB_CNPJ_DATA_DIR', '../data') }}/rfb-cnpj.duckdb"

      # Default location for materialized='external' files
      #   https://github.com/duckdb/dbt-duckdb#reading-and-writing-external-files
      external_root: "{{ env_var('RFB_CNPJ_DATA_DIR', '../data') }}/2-parquet_sources"
