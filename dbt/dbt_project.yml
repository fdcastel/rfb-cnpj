name: 'rfb_cnpj'
version: '2.0.0'
require-dbt-version: ">=1.12.0"

profile: 'rfb_cnpj'

model-paths: ["models"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  rfb_cnpj:
    bronze:
      +materialized: ephemeral
    silver:
      +materialized: external
    gold:
      +materialized: view
