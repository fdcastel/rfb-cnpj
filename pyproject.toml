[project]
name = "rfb-cnpj"
version = "1.0.2"
description = "Ferramentas para consulta da base nacional de CNPJ da RFB."
readme = "README.md"
authors = [
    { name = "F.D.Castel", email = "fdcastel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.9.1",
    "dbt-duckdb>=1.9.1",
    "duckdb>=1.1.3",
    "httpx>=0.28.1",
    "tqdm>=4.67.1",
]

[project.scripts]
build = "rfb_cnpj.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
