[project]
name = "rfb-cnpj"
version = "2.0.0"
description = "Ferramentas para consulta da base nacional de CNPJ da RFB."
readme = "README.md"
authors = [
    { name = "F.D.Castel", email = "fdcastel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "tqdm>=4.70.1",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
build = "rfb_cnpj.build:main"
extract-cnae = "rfb_cnpj.extract:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the live RFB file server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
