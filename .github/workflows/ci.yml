name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: detects layout/URL changes on the RFB server early.
    - cron: "0 9 * * 1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Tests (offline, includes end-to-end dbt pipeline on real sample data)
        run: uv run pytest -m "not network" -v

  network:
    name: Live RFB server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run pytest -m network -v
